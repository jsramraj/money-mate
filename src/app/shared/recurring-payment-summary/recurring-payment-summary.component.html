<div class="recurring-summary" [class.recurring-summary--inactive]="isInactive" [class.recurring-summary--single]="!isRecurring">
  <ion-icon name="repeat-outline" aria-hidden="true"></ion-icon>
  <span>{{ summaryText }}</span>
  <ion-icon
    [name]="statusIconName"
    [color]="statusIconColor"
    [attr.aria-label]="statusIconLabel"
    [attr.title]="isInactive ? 'Inactive' : 'Active'"
  ></ion-icon>
</div>
