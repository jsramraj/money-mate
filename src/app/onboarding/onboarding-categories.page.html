<ion-header>
  <ion-toolbar>
    <ion-title>Select Categories</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let category of categories">
      <ion-label>{{ category.name }}</ion-label>
      <ion-checkbox slot="end" [(ngModel)]="category.selected"></ion-checkbox>
    </ion-item>
  </ion-list>

  <div class="ion-padding">
    <ion-button expand="block" (click)="saveCategories()">Save</ion-button>
  </div>
</ion-content>
